<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SK Copy Shop</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fb;
    color:#222;
}

header{
    background:#0d47a1;
    color:white;
    text-align:center;
    padding:30px 15px;
}

header h1{
    font-size:34px;
    margin-bottom:8px;
}

header p{
    font-size:17px;
}

nav{
    background:#08306b;
    padding:13px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 10px;
    font-weight:bold;
}

.hero{
    background:white;
    text-align:center;
    padding:45px 20px;
}

.hero h2{
    color:#0d47a1;
    font-size:30px;
    margin-bottom:12px;
}

.hero p{
    font-size:18px;
    margin-bottom:22px;
}

.button{
    display:inline-block;
    background:#25D366;
    color:white;
    padding:12px 22px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
}

.products{
    padding:40px 15px;
    text-align:center;
}

.products h2{
    color:#0d47a1;
    font-size:28px;
    margin-bottom:25px;
}

.cards{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
}

.card{
    background:white;
    width:270px;
    padding:18px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,0.12);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:10px;
    margin-bottom:15px;
}

.card h3{
    color:#0d47a1;
    font-size:21px;
    margin-bottom:8px;
}

.price{
    font-size:20px;
    font-weight:bold;
    margin:10px 0 15px;
}

.order{
    background:#25D366;
}

.contact{
    background:#e3f2fd;
    text-align:center;
    padding:40px 20px;
}

.contact h2{
    color:#0d47a1;
    margin-bottom:15px;
}

.contact p{
    margin:8px;
}

footer{
    background:#08306b;
    color:white;
    text-align:center;
    padding:20px;
}

@media(max-width:600px){
    .card{
        width:100%;
        max-width:330px;
    }
}
</style>
</head>

<body>

<header>
    <h1>SK COPY SHOP</h1>
    <p>कॉपी • स्टेशन
